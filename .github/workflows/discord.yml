name: Discord Commit Notification

on: [push]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            let msg = context.payload.head_commit.message || '';
            if (msg.length > 1800) {
              msg = msg.substring(0, 1800) + '...';
            }
            const payload = {
              username: "GitHub Monitor",
              description: `🔨 **New commit on [${context.repo.owner}/${context.repo.repo}]** by *${context.actor}*\n\n${msg}`
            };
            const res = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!res.ok) {
              throw new Error(`Discord Webhook failed with status ${res.status}`);
            }
