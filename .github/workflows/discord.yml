name: Discord Commit Notification

on: [push]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const head = context.payload.head_commit;
            if (!head) {
              console.log('No head commit (branch/tag deleted?), nothing to announce.');
              return;
            }

            const cut = (text, max) => (text.length > max ? text.substring(0, max - 1).trimEnd() + '…' : text);

            // Commit message layout (see generate_msg.py):
            //   line 1  = plain-Vietnamese summary for non-technical readers
            //   rest    = technical title + bullet notes (English), optional Co-authored-by trailers
            const raw = (head.message || '').replace(/\r\n/g, '\n').trim();
            const lines = raw.split('\n');
            const summary = (lines[0] || '').trim() || 'Có cập nhật mới';

            const coAuthors = [];
            const notes = lines.slice(1).filter((line) => {
              const m = line.match(/^Co-authored-by:\s*(.+?)\s*(?:<[^>]*>)?\s*$/i);
              if (m) { coAuthors.push(m[1]); return false; }
              return true;
            }).join('\n').trim();

            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const commitUrl = `${repoUrl}/commit/${head.id || context.sha}`;
            const sha7 = (head.id || context.sha).substring(0, 7);
            const branch = (context.ref || '').replace('refs/heads/', '');

            const fields = [];
            if (notes) {
              fields.push({ name: '🔧 Chi tiết kỹ thuật (dành cho dev)', value: cut(notes, 1000) });
            }
            if (coAuthors.length) {
              fields.push({ name: '🤝 Làm cùng', value: cut(coAuthors.join(', '), 1000) });
            }
            const commits = context.payload.commits || [];
            if (commits.length > 1) {
              const list = commits.slice(-10).map((c) =>
                `• [\`${c.id.substring(0, 7)}\`](${repoUrl}/commit/${c.id}) ${cut((c.message || '').split('\n')[0], 80)}`
              ).join('\n');
              fields.push({ name: `📦 Đợt đẩy này gồm ${commits.length} thay đổi`, value: cut(list, 1000) });
            }

            const payload = {
              username: 'Arona Update',
              // Commit text is user-written: never let it ping @everyone / roles / users.
              allowed_mentions: { parse: [] },
              embeds: [{
                author: {
                  name: context.actor,
                  url: `https://github.com/${context.actor}`,
                  icon_url: `https://github.com/${context.actor}.png`
                },
                title: cut(`🔨 ${summary}`, 250),
                url: commitUrl,
                color: 5814783,
                fields,
                footer: { text: `${context.repo.owner}/${context.repo.repo}${branch ? ' · ' + branch : ''} · ${sha7}` },
                timestamp: head.timestamp
              }]
            };

            const https = require('https');
            const url = new URL(process.env.DISCORD_WEBHOOK_URL);

            const options = {
              hostname: url.hostname,
              path: url.pathname + url.search,
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              }
            };

            await new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                res.on('error', (e) => {
                  clearTimeout(timeout);
                  reject(e);
                });
                res.on('end', () => {
                  clearTimeout(timeout);
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve();
                  } else {
                    reject(new Error(`Discord Webhook failed with status ${res.statusCode}`));
                  }
                });
                res.resume();
              });
              const timeout = setTimeout(() => {
                req.destroy(new Error('Discord webhook request timed out after 15 seconds'));
              }, 15000);
              req.on('error', (e) => {
                clearTimeout(timeout);
                reject(e);
              });
              req.write(JSON.stringify(payload));
              req.end();
            });
