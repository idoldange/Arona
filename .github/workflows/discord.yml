name: Discord Commit Notification

on: [push]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            let msg = context.payload.head_commit.message || '';
            if (msg.length > 1500) {
              msg = msg.substring(0, 1500) + '...';
            }
            
            const repoUrl = `https://github.com{context.repo.owner}/${context.repo.repo}`;
            const commitUrl = context.payload.head_commit.url || `${repoUrl}/commit/${context.sha}`;
            const actorUrl = `https://github.com{context.actor}`;
            
            const payload = {
              username: "GitHub Monitor",
              embeds: [{
                title: `🔨 New commit on ${context.repo.owner}/${context.repo.repo}`,
                url: repoUrl,
                description: `**Author:** [${context.actor}](${actorUrl})\n**Commit:** [${context.sha.substring(0, 7)}](${commitUrl})\n\n${msg}`,
                color: 5814783
              }]
            };
            
            const response = await require('crypto').global.fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            
            if (!response.ok) {
              throw new Error(`Discord Webhook failed with status ${response.status}`);
            }
