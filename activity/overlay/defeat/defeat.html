<!DOCTYPE html>
<html lang="en" data-fx-touch="pan-y">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEFEAT</title>

</head>
<body>
<div class="layer" id="scrim"></div>
<div id="stage">
  
  <div id="strip" class="tl"></div>
  <div id="stripTL" class="tl"></div>
  <div id="stripBL" class="tl"></div>
  <div id="mark"><img id="markImg" src="assets/img/asset_f2f31314.png" alt="DEFEAT"></div>
  <div id="trow" class="tl">
    <div id="tchip" class="tl"></div>
    <img id="clock" class="tl" src="assets/img/asset_57837d3b.png" alt="">
    <div id="tlabelTxt">Time</div>
    <div id="timeTxt">0:00</div>
  </div>
  <div id="grpc" class="tl">
    <div id="barC" class="tl"></div>
    <div id="barG" class="tl"></div>
    <img id="hdiv" class="tl" src="assets/img/asset_8406c82d.png" alt="">
    <div id="nameTxt">Player</div>
    <div id="hpTxt"></div>
  </div>
  <div id="confirm" class="tl">
    <img class="tl" src="assets/img/asset_1cba3ea1.png" alt="Confirm">
  </div>
  <img id="nowload" class="tl" src="assets/img/asset_756df3a9.png" alt="">
  <div id="btn" class="tl">
    <img class="tl" src="assets/img/asset_aad80257.png" alt="analysis">
  </div>
  <div id="repBack"></div>
  <div id="rep">
    <img id="repbg" src="assets/img/asset_35de2ed5.png" alt="">
    <div id="repTitleTxt">Game Analysis</div>
    <div id="repBody">No major mistakes found.</div>
    <div id="repClose"></div>
  </div>
</div>

<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/main.js"></script>
<script type="module" src="/arona-fx.js"></script>
</body>
</html>
