<!DOCTYPE html>
<html lang="en" data-fx-touch="pan-y">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Arona Chess</title>
    <style>
        :root {
            --bg: #262421;              /* chess.com dark background */
            --panel: #262421;
            --panel-dark: #21201e;
            --line: #3d3b38;
            --text: #e8e8e6;
            --text-dim: #9c9a97;
            --sq-light: #ebeed0;
            --sq-dark: #779556;
            --hl: rgba(247, 247, 105, 0.55);
            --danger: #cf4040;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
            touch-action: none;
        }
        #root { height: 100%; display: none; }
        /* Mac dinh hien loading.html (iframe ben duoi) ngay tu dau -> khong con man xam luc cho dang nhap / poll state dau tien */
        #gate {
            /* fixed + inset:0 -> luon phu kin man hinh o moi thiet bi / ti le (khong phu thuoc height cua html/body) */
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #000;
            display: grid;
            place-items: center;
            color: var(--text-dim);
            text-align: center;
            padding: 0;
            white-space: pre-wrap;
        }
        .layout {
            height: 100%;
            display: flex;
            gap: 10px;
            padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            justify-content: center;
        }
        .board-side { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .player-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
        }
        .avatar {
            width: 34px; height: 34px;
            border-radius: 5px;
            background: #3d3b38;
            object-fit: cover;
            flex: none;
        }
        .avatar.letter { display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px; }
        /* [hidden] khong tac dung khi rule khac dat display -> phai ep tay */
        .avatar.letter[hidden] { display: none; }
        .plate { display: contents; }
        .who { min-width: 0; flex: 1; }
        .clock {
            flex: none;
            margin-left: 8px;
            min-width: 84px;
            padding: 6px 10px;
            border-radius: 5px;
            text-align: center;
            font: 700 19px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
            font-variant-numeric: tabular-nums;
            background: #3d3b38;
            color: #9c9a97;
        }
        .clock[hidden] { display: none; }
        .clock.active { background: #fff; color: #262421; }
        .clock.low { color: #ff6b6b; }
        .clock.active.low { background: #cf4040; color: #fff; }
        .clock.flagged { background: #cf4040; color: #fff; }
        .who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .who .sub { color: var(--text-dim); font-size: 12px; }
        .captured { display: inline-flex; align-items: center; margin-left: auto; padding-left: 8px; }
        .captured img { width: 20px; height: 20px; margin-left: -6px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
        .captured img:first-child { margin-left: 0; }
        .mat-diff { color: var(--text-dim); font-size: 12px; margin-left: 6px; }
        .board-wrap {
            /* khong dung calc(100% - x): cha (board-side) co theo content -> % giai quyet vong cho gia tri rac lam ban co be xiu */
            /* vua ca chieu cao (2 thanh ten ~ 124px) lan chieu rong (panel + le ~ 342px): tablet / dien thoai ngang deu nhin du ban co */
            width: min(calc(100vh - 124px), 640px, calc(100vw - 342px));
            width: min(calc(100dvh - 124px), 640px, calc(100vw - 342px));
            max-width: 100%;
            align-self: center;
            margin: 0 auto;
            aspect-ratio: 1;
            position: relative;
            user-select: none;
            touch-action: none;
        }
        #board {
            position: absolute; inset: 0;
            display: grid;
            grid-template: repeat(8, 1fr) / repeat(8, 1fr);
            box-shadow: 0 2px 12px rgba(0,0,0,.4);
        }
        .sq { position: relative; background: transparent; }
        .sq.light { background: var(--sq-light); }
        .sq.dark { background: var(--sq-dark); }
        .sq .coord {
            position: absolute;
            font-size: 9px;
            font-weight: 700;
            opacity: .8;
            pointer-events: none;
        }
        .sq .coord.rank { top: 2px; left: 2px; }
        .sq .coord.file { bottom: 1px; right: 2px; }
        .sq.hl { box-shadow: inset 0 0 0 40px var(--hl); }
        .sq.check::after {
            content: "";
            position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(255,77,77,.85) 20%, rgba(255,77,77,.28) 65%, transparent 75%);
        }
        .piece {
            position: absolute; inset: 6%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            z-index: 2;
        }
        .piece.dragging { z-index: 50; cursor: grabbing; }
        .sq .target {
            position: absolute; inset: 0;
            display: grid; place-items: center;
            pointer-events: none;
            z-index: 3;
        }
        .sq .target.dot { }
        .sq .target.dot::after {
            content: "";
            width: 30%; height: 30%;
            border-radius: 50%;
            background: rgba(22, 22, 22, .45);
        }
        .sq .target.ring::after {
            content: "";
            width: 88%; height: 88%;
            border-radius: 50%;
            border: 4px solid rgba(22, 22, 22, .45);
        }
        .sq.hint-from { box-shadow: inset 0 0 0 40px rgba(96, 165, 250, .45); }
        .sq.hint-to { box-shadow: inset 0 0 0 6px rgba(96, 165, 250, .8); }
        .panel {
            width: 292px;
            max-width: 34vw;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            background: var(--panel-dark);
            border-radius: 8px;
            overflow-x: hidden;
            overflow-y: auto;      /* man hinh nam ngang thap (dien thoai xoay ngang): panel cuon duoc thay vi bi cat */
        }
        .panel-title {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-weight: 700; font-size: 15px;
            padding: 10px;
            border-bottom: 1px solid var(--line);
        }
        .panel-status {
            padding: 9px 12px;
            font-size: 13px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--line);
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
        }
        .badge {
            font-size: 11px; font-weight: 700;
            background: #4a4845; color: #d6d4d1;
            border-radius: 20px; padding: 2px 8px;
        }
        .moves {
            flex: 1;
            min-height: 120px;
            overflow-y: auto;
            touch-action: pan-y;
            font-variant-numeric: tabular-nums;
        }
        .mv-row { display: flex; align-items: stretch; }
        .mv-row:nth-child(odd) { background: #2c2b29; }
        .mv-num {
            width: 34px;
            padding: 6px 0 6px 10px;
            color: var(--text-dim);
            flex: none;
            align-self: center;
        }
        .mv {
            flex: 1;
            padding: 6px 0;
            text-align: center;
        }
        .mv.last { background: #474644; border-radius: 6px; margin: 0 4px; padding: 6px 0; }
        .mv-empty { flex: 1; }
        .actions { display: grid; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
        .bgm {
            display: grid;
            grid-template-columns: minmax(0, 1fr);      /* khong cho dong status nowrap ep track giãn qua rong */
            gap: 6px;
            padding: 8px 10px;
            border-top: 1px solid var(--line);
            font-size: 12px;
            color: var(--text-dim);
        }
        .bgm[hidden] { display: none; }
        .bgm-row { display: flex; align-items: center; gap: 5px; min-width: 0; }
        .elo-row {
            display: flex; align-items: center; gap: 5px; min-width: 0;
            padding: 8px 10px 0;
            font-size: 12px; color: var(--text-dim);
        }
        .elo-row[hidden] { display: none; }
        .elo-row span { flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .elo-row input[type="range"] { flex: 1; min-width: 0; height: 18px; accent-color: #779556; }
        #overlay {
            position: fixed; inset: 0; z-index: 60; background: transparent;
            display: flex; align-items: center; justify-content: center;
        }
        #overlay[hidden] { display: none; }
        #overlay-frame { width: 100%; height: 100%; border: none; display: block; }
        #overlay-skip {
            position: absolute; bottom: 46px; right: 64px; z-index: 61;
            font-size: 12px; padding: 6px 14px; display: none;
        }
        .bgm-row select, .bgm-row input[type="text"] {
            flex: 1;
            min-width: 0;
            height: 26px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background-color: #262421;
            color: var(--text);
            font: inherit;
            font-size: 11px;
        }
        .bgm-row select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 22px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%239c9a97' stroke-width='1.5' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            cursor: pointer;
        }
        .bgm-row input[type="range"] { flex: 1; min-width: 0; height: 18px; accent-color: #779556; }
        .bgm-mini { width: 28px; height: 26px; padding: 0; font-size: 11px; flex: none; border-radius: 5px; }
        .bgm-status { min-height: 12px; color: var(--text-dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn {
            height: 34px;
            border-radius: 6px;
            border: 0;
            background: #33312e;
            color: var(--text);
            font: inherit; font-size: 13px;
            display: grid; place-items: center;
            cursor: pointer;
        }
        .btn:hover { background: #3d3b38; }
        .btn[disabled] { opacity: .5; cursor: default; }
        .promote {
            position: absolute;
            z-index: 90;
            display: none;
            background: #33312e;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,.5);
            padding: 6px;
        }
        .promote img {
            width: 48px; height: 48px;
            display: block;
            cursor: pointer;
            border-radius: 6px;
        }
        .promote img:hover { background: #4a4845; }
        #toaster {
            position: absolute;
            left: 50%; bottom: 18%;
            transform: translateX(-50%);
            background: rgba(20, 21, 26, .95);
            color: #fff;
            border-radius: 8px;
            padding: 8px 14px;
            z-index: 100;
            display: none;
            max-width: 80%;
        }

        /* ================= Blue Archive themes (thiet ke trong temp/UI.clip, canvas 1920x1080) =================
           ba-light / ba-dark: anh nen lop hoc, ban co go, panel hong #fb94a7 + khung chat Noto Sans, nut trang tren nen xam.
           Bien mau dat tren <html data-theme> (early.js + applyTheme) -> nen trang, nut Theme va #root deu dung chung. */
        @font-face {
            font-family: "Noto Sans";
            src: url("/ba-theme/NotoSans-var.woff2") format("woff2");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        html[data-theme="ba-light"], html[data-theme="ba-dark"] {
            --panel-w: clamp(300px, 29vw, 460px);
            --sq-light: #f0d9b5;           /* ban co "wood" */
            --sq-dark: #b58863;
            --ba-title: #fb94a7;           /* thanh tieu de: dark giu nguyen */
            --ba-bubble-l: #4c5b73;        /* bubble doi thu (xam xanh) */
            --ba-bubble-r: #4a8bdb;        /* bubble sensei */
            font-family: "Noto Sans", "Segoe UI", system-ui, sans-serif;
        }
        html[data-theme="ba-light"] {
            --bg: #5ec4fe;
            --panel: #ffffff; --panel-dark: #ffffff;
            --line: #e4e7eb;
            --text: #2a2e35; --text-dim: #6a7280;
            --ba-bg-img: url("/ba-theme/bg-light.webp");
            --ba-actions: #d5d5d5;
            --ba-btn: #ffffff; --ba-btn-text: #111111; --ba-btn-hover: #f1f5f9;
            --ba-name: #3b4252;
            --ba-chip: #eef1f4;
        }
        html[data-theme="ba-dark"] {
            --bg: #0f326e;
            --panel: #313338; --panel-dark: #313338;      /* xam tro Discord */
            --line: #3f4147;
            --text: #dbdee1; --text-dim: #949ba4;
            --ba-bg-img: url("/ba-theme/bg-dark.webp");
            --ba-actions: #2b2d31;
            --ba-btn: #4e5058; --ba-btn-text: #f2f3f5; --ba-btn-hover: #5d6068;
            --ba-name: #f2f3f5;
            --ba-chip: #404249;
            --ba-bubble-r: #3f7fd6;
        }
        html[data-theme^="ba"] { background: var(--bg) var(--ba-bg-img) center / cover no-repeat fixed; }
        html[data-theme^="ba"] body { background: transparent; font-family: inherit; }
        html[data-theme^="ba"] button, html[data-theme^="ba"] select, html[data-theme^="ba"] input { font-family: inherit; }

        /* --- thanh nguoi choi: khung avatar hinh binh hanh + ten trang --- */
        html[data-theme^="ba"] .plate {
            display: block; position: relative; flex: none;
            width: 54px; height: 44px;
            background: url("/ba-theme/avatar-frame.png") center / 100% 100% no-repeat;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35));
        }
        html[data-theme^="ba"] .plate .avatar {
            position: absolute; left: 10%; top: 12%;
            width: 80%; height: 76%;        /* kich thuoc ro rang: <img> co kich thuoc goc thi width/height:auto + inset KHONG co gian ra -> avatar tran khoi khung */
            object-fit: cover;
            border-radius: 0; background-color: #dfe6ee;
            -webkit-mask: url("/ba-theme/avatar-frame.png") center / 100% 100% no-repeat;
            mask: url("/ba-theme/avatar-frame.png") center / 100% 100% no-repeat;
        }
        html[data-theme^="ba"] .plate .avatar.letter { font-size: 16px; }
        html[data-theme^="ba"] .player-bar .name {
            color: #fff; font-weight: 700; font-size: 20px;
            text-shadow: 0 1px 4px rgba(0, 20, 60, .65);
        }
        html[data-theme^="ba"] .player-bar .sub { color: rgba(255, 255, 255, .88); text-shadow: 0 1px 3px rgba(0, 20, 60, .6); }
        html[data-theme^="ba"] .mat-diff { color: #fff; text-shadow: 0 1px 3px rgba(0, 20, 60, .6); }
        html[data-theme^="ba"] .clock { background: rgba(8, 24, 64, .55); color: #e6f0ff; }
        html[data-theme^="ba"] .clock.active { background: #fff; color: #1c2b4a; }
        html[data-theme^="ba"] .clock.low { color: #ffb4b4; }
        html[data-theme^="ba"] .clock.active.low, html[data-theme^="ba"] .clock.flagged { background: #cf4040; color: #fff; }
        html[data-theme^="ba"] #board { box-shadow: 0 0 0 3px rgba(255, 255, 255, .92), 0 8px 28px rgba(0, 20, 60, .4); }

        /* --- panel: tieu de hong, trang thai, lich su nuoc di (chat), khu nut xam --- */
        html[data-theme^="ba"] .panel {
            background: var(--panel);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 20, 60, .35);
        }
        html[data-theme^="ba"] .panel-title {
            flex: none;
            background: var(--ba-title); color: #fff;
            border-bottom: 0;
            padding: 14px 10px;
            font-size: clamp(18px, 1.7vw, 28px); font-weight: 700; letter-spacing: .2px;
            text-shadow: 0 1px 2px rgba(120, 20, 50, .2);
        }
        html[data-theme^="ba"] .panel-status { flex: none; background: var(--panel); color: var(--text-dim); border-bottom: 1px solid var(--line); }
        html[data-theme^="ba"] .badge { background: var(--ba-chip); color: var(--text-dim); }
        html[data-theme^="ba"] .moves { background: var(--panel); color: var(--text); container-type: inline-size; }
        html[data-theme^="ba"] .actions {
            background: var(--ba-actions);
            border-top: 0;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px; padding: 8px;
        }
        html[data-theme^="ba"] .actions .btn {
            height: 42px; border-radius: 6px;
            background: var(--ba-btn); color: var(--ba-btn-text);
            font-size: 17px; font-weight: 500;
            box-shadow: 0 1px 0 rgba(0, 0, 0, .08);
        }
        html[data-theme^="ba"] .actions .btn:hover { background: var(--ba-btn-hover); }
        html[data-theme^="ba"] .actions .btn:last-child { grid-column: 1 / -1; }
        html[data-theme^="ba"] .elo-row, html[data-theme^="ba"] .bgm {
            background: var(--ba-actions); border-top: 1px solid rgba(0, 0, 0, .06); color: var(--text-dim);
        }
        html[data-theme^="ba"] .elo-row { padding-bottom: 8px; }
        html[data-theme^="ba"] .bgm-row select, html[data-theme^="ba"] .bgm-row input[type="text"] {
            background-color: var(--ba-btn); color: var(--ba-btn-text); border-color: transparent;
        }

        /* --- lich su nuoc di dang khung chat Blue Archive (bubble: doi thu trai, sensei phai) --- */
        .moves.chat {
            display: flex; flex-direction: column; gap: 10px;
            padding: 12px 14px 18px;
            font-family: "Noto Sans", "Segoe UI", system-ui, sans-serif;
        }
        .moves.chat:empty::before {
            content: "No moves yet";
            color: var(--text-dim); font-size: 13px; text-align: center; padding: 18px 0;
        }
        .moves.chat .msg { display: flex; align-items: flex-start; gap: 10px; flex: none; }
        .moves.chat .msg.right { justify-content: flex-end; }
        .moves.chat .msg-avatar {
            flex: none; width: 40px; height: 40px;
            width: clamp(36px, 12cqw, 56px); height: clamp(36px, 12cqw, 56px);
            border-radius: 50%; object-fit: cover; background: #cfd6df;
        }
        .moves.chat .msg-avatar.letter {
            display: grid; place-items: center;
            color: #fff; font-weight: 700; font-size: 18px;
        }
        .moves.chat .msg-col { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; max-width: 80%; }
        .moves.chat .msg.right .msg-col { align-items: flex-end; }
        .moves.chat .msg-name {
            font-size: 14px; font-size: clamp(13px, 3.7cqw, 17px);
            font-weight: 700; line-height: 1.25; color: var(--ba-name);
        }
        .moves.chat .bubble {
            position: relative; width: fit-content; max-width: 100%;
            padding: .3em .8em;
            border-radius: 8px;
            background: var(--ba-bubble-l); color: #fff;
            font-size: 15px; font-size: clamp(14px, 3.9cqw, 19px);
            font-weight: 400; line-height: 1.4;
            overflow-wrap: anywhere;
        }
        .moves.chat .msg.right .bubble { background: var(--ba-bubble-r); }
        .moves.chat .bubble.first { border-top-left-radius: 0; }
        /* duoi bubble: tam giac 8x9 de len bubble 1px (khong co khe ho do lam tron pixel) */
        .moves.chat .bubble.first::before {
            content: ""; position: absolute; top: 0; left: -7px; width: 8px; height: 9px;
            background: var(--ba-bubble-l); clip-path: polygon(0 0, 100% 0, 100% 100%);
        }
        .moves.chat .msg.right .bubble.first { border-top-left-radius: 8px; border-top-right-radius: 0; }
        .moves.chat .msg.right .bubble.first::before {
            left: auto; right: -7px;
            background: var(--ba-bubble-r); clip-path: polygon(0 0, 100% 0, 0 100%);
        }

        /* --- bo cuc desktop / tablet / dien thoai ngang: ban co to hon + panel rong hon (phan bo theo UI.clip) --- */
        @media (min-width: 601px), (orientation: landscape) {
            html[data-theme^="ba"] .layout { gap: 18px; }
            html[data-theme^="ba"] .board-wrap {
                width: min(calc(100vh - 140px), 840px, calc(100vw - var(--panel-w) - 56px));
                width: min(calc(100dvh - 140px), 840px, calc(100vw - var(--panel-w) - 56px));
            }
            html[data-theme^="ba"] .panel { width: var(--panel-w); max-width: 40vw; min-width: 240px; }
        }

        /* ================= Nut Options (banh rang) + bang Options (thiet ke trong temp/UI.clip) =================
           Bang Options la 1 "stage" 1356x705 co dinh, JS chi scale deu (--s) cho vua man hinh -> khong doi ti le o bat ky man hinh nao. */
        #options-btn {
            position: fixed; top: 0; right: 0; z-index: 55;
            width: 66px; height: 32px; padding: 0; border: 0; background: none; cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0, 30, 80, .32));
            -webkit-tap-highlight-color: transparent;
        }
        #options-btn::before { content: ""; position: absolute; inset: 0; background: #fff; clip-path: polygon(0 0, 100% 0, 100% 100%, 24% 100%); }
        #options-btn:hover::before { background: #eaf4ff; }
        #options-btn img { position: absolute; left: 20px; top: 0; width: 36px; height: 32px; display: block; pointer-events: none; }
        #options-btn[hidden] { display: none; }
        #options { position: fixed; inset: 0; z-index: 70; touch-action: none; }
        #options[hidden] { display: none; }
        .opt-scrim { position: absolute; inset: 0; background: rgba(4, 12, 34, .62); }
        .opt-stage {
            position: absolute; left: 50%; top: 50%;
            width: 1356px; height: 705px;
            transform: translate(-50%, -50%) scale(var(--s, 1));
            transform-origin: 50% 50%;
            font-family: "Noto Sans", "Segoe UI", system-ui, sans-serif;
            -webkit-user-select: none; user-select: none;
            touch-action: none;
        }
        .opt-stage .o { position: absolute; display: block; max-width: none; pointer-events: none; -webkit-user-drag: none; }
        .opt-stage button { position: absolute; margin: 0; padding: 0; border: 0; background: none; cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent; }
        .opt-stage .o-page { position: absolute; inset: 0; pointer-events: none; }
        .opt-stage .o-page[hidden] { display: none; }
