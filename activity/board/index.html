<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arona Chess</title>
    <style>
        :root {
            --bg: #262421;              /* chess.com dark background */
            --panel: #262421;
            --panel-dark: #21201e;
            --line: #3d3b38;
            --text: #e8e8e6;
            --text-dim: #9c9a97;
            --sq-light: #ebeed0;
            --sq-dark: #779556;
            --hl: rgba(247, 247, 105, 0.55);
            --danger: #cf4040;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
        }
        #root { height: 100%; display: none; }
        #gate {
            height: 100%;
            display: none;
            place-items: center;
            color: var(--text-dim);
            text-align: center;
            padding: 24px;
        }
        .layout {
            height: 100%;
            display: flex;
            gap: 10px;
            padding: 10px;
            justify-content: center;
        }
        .board-side { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .player-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
        }
        .avatar {
            width: 34px; height: 34px;
            border-radius: 5px;
            background: #3d3b38;
            object-fit: cover;
            flex: none;
        }
        .avatar.letter { display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px; }
        .who { min-width: 0; }
        .who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .who .sub { color: var(--text-dim); font-size: 12px; }
        .captured { display: inline-flex; align-items: center; margin-left: auto; padding-left: 8px; }
        .captured img { width: 20px; height: 20px; margin-left: -6px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
        .captured img:first-child { margin-left: 0; }
        .mat-diff { color: var(--text-dim); font-size: 12px; margin-left: 6px; }
        .board-wrap {
            width: min(76vmin, 640px, calc(100% - 8px));
            aspect-ratio: 1;
            position: relative;
            user-select: none;
            touch-action: none;
        }
        #board {
            position: absolute; inset: 0;
            display: grid;
            grid-template: repeat(8, 1fr) / repeat(8, 1fr);
            box-shadow: 0 2px 12px rgba(0,0,0,.4);
        }
        .sq { position: relative; background: transparent; }
        .sq.light { background: var(--sq-light); }
        .sq.dark { background: var(--sq-dark); }
        .sq .coord {
            position: absolute;
            font-size: 9px;
            font-weight: 700;
            opacity: .8;
            pointer-events: none;
        }
        .sq .coord.rank { top: 2px; left: 2px; }
        .sq .coord.file { bottom: 1px; right: 2px; }
        .sq.hl { box-shadow: inset 0 0 0 40px var(--hl); }
        .sq.check::after {
            content: "";
            position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(255,77,77,.85) 20%, rgba(255,77,77,.28) 65%, transparent 75%);
        }
        .piece {
            position: absolute; inset: 6%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            z-index: 2;
        }
        .piece.dragging { z-index: 50; cursor: grabbing; }
        .sq .target {
            position: absolute; inset: 0;
            display: grid; place-items: center;
            pointer-events: none;
            z-index: 3;
        }
        .sq .target.dot { }
        .sq .target.dot::after {
            content: "";
            width: 30%; height: 30%;
            border-radius: 50%;
            background: rgba(22, 22, 22, .45);
        }
        .sq .target.ring::after {
            content: "";
            width: 88%; height: 88%;
            border-radius: 50%;
            border: 4px solid rgba(22, 22, 22, .45);
        }
        .sq.hint-from { box-shadow: inset 0 0 0 40px rgba(96, 165, 250, .45); }
        .sq.hint-to { box-shadow: inset 0 0 0 6px rgba(96, 165, 250, .8); }
        .panel {
            width: 292px;
            max-width: 34vw;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            background: var(--panel-dark);
            border-radius: 8px;
            overflow: hidden;
        }
        .panel-title {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-weight: 700; font-size: 15px;
            padding: 10px;
            border-bottom: 1px solid var(--line);
        }
        .panel-status {
            padding: 9px 12px;
            font-size: 13px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--line);
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
        }
        .badge {
            font-size: 11px; font-weight: 700;
            background: #4a4845; color: #d6d4d1;
            border-radius: 20px; padding: 2px 8px;
        }
        .moves {
            flex: 1;
            overflow-y: auto;
            font-variant-numeric: tabular-nums;
        }
        .mv-row { display: flex; align-items: stretch; }
        .mv-row:nth-child(odd) { background: #2c2b29; }
        .mv-num {
            width: 34px;
            padding: 6px 0 6px 10px;
            color: var(--text-dim);
            flex: none;
            align-self: center;
        }
        .mv {
            flex: 1;
            padding: 6px 0;
            text-align: center;
        }
        .mv.last { background: #474644; border-radius: 6px; margin: 0 4px; padding: 6px 0; }
        .mv-empty { flex: 1; }
        .actions { display: grid; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
        .btn {
            height: 34px;
            border-radius: 6px;
            border: 0;
            background: #33312e;
            color: var(--text);
            font: inherit; font-size: 13px;
            display: grid; place-items: center;
            cursor: pointer;
        }
        .btn:hover { background: #3d3b38; }
        .btn[disabled] { opacity: .5; cursor: default; }
        .promote {
            position: absolute;
            z-index: 90;
            display: none;
            background: #33312e;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,.5);
            padding: 6px;
        }
        .promote img {
            width: 48px; height: 48px;
            display: block;
            cursor: pointer;
            border-radius: 6px;
        }
        .promote img:hover { background: #4a4845; }
        #toaster {
            position: absolute;
            left: 50%; bottom: 18%;
            transform: translateX(-50%);
            background: rgba(20, 21, 26, .95);
            color: #fff;
            border-radius: 8px;
            padding: 8px 14px;
            z-index: 100;
            display: none;
            max-width: 80%;
        }
    </style>
</head>
<body>
<div id="root">
    <div class="layout">
        <div class="board-side">
            <div class="player-bar" id="bar-top">
                <img class="avatar" id="top-avatar" alt="">
                <span class="avatar letter" id="top-avatar-lg" hidden></span>
                <div class="who">
                    <div class="name" id="top-name"></div>
                    <div class="sub" id="top-sub"></div>
                </div>
            </div>
            <div class="board-wrap">
                <div id="board"></div>
                <div class="promote" id="promote"></div>
                <div id="toaster"></div>
            </div>
            <div class="player-bar" id="bar-bottom">
                <img class="avatar" id="bottom-avatar" alt="">
                <span class="avatar letter" id="bottom-avatar-lg" hidden></span>
                <div class="who">
                    <div class="name" id="bottom-name"></div>
                    <div class="sub" id="bottom-sub"></div>
                </div>
                <span class="captured" id="captured"></span>
            </div>
        </div>
        <aside class="panel" id="panel">
            <div class="panel-title" id="panel-title"></div>
            <div class="panel-status"><span id="status"></span><span class="badge" id="room"></span></div>
            <div class="moves" id="moves"></div>
            <div class="actions" id="actions"></div>
        </aside>
    </div>
</div>
<div id="gate"></div>
<script type="module" src="/arona-boot.js"></script>
<script type="module" src="/arona-board.js"></script>
</body>
</html>
