<!DOCTYPE html>
<html lang="en" data-fx-touch="pan-y" data-fx-skip=".moves">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Arona Chess</title>
    <style>
        :root {
            --bg: #262421;              /* chess.com dark background */
            --panel: #262421;
            --panel-dark: #21201e;
            --line: #3d3b38;
            --text: #e8e8e6;
            --text-dim: #9c9a97;
            --sq-light: #ebeed0;
            --sq-dark: #779556;
            --hl: rgba(247, 247, 105, 0.55);
            --danger: #cf4040;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
            touch-action: none;
        }
        #root { height: 100%; display: none; }
        /* Mac dinh hien loading.html (iframe ben duoi) ngay tu dau -> khong con man xam luc cho dang nhap / poll state dau tien */
        #gate {
            /* fixed + inset:0 -> luon phu kin man hinh o moi thiet bi / ti le (khong phu thuoc height cua html/body) */
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #000;
            display: grid;
            place-items: center;
            color: var(--text-dim);
            text-align: center;
            padding: 0;
            white-space: pre-wrap;
        }
        .layout {
            height: 100%;
            display: flex;
            gap: 10px;
            padding: 10px;
            justify-content: center;
        }
        .board-side { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .player-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 4px;
        }
        .avatar {
            width: 34px; height: 34px;
            border-radius: 5px;
            background: #3d3b38;
            object-fit: cover;
            flex: none;
        }
        .avatar.letter { display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px; }
        /* [hidden] khong tac dung khi rule khac dat display -> phai ep tay */
        .avatar.letter[hidden] { display: none; }
        .who { min-width: 0; flex: 1; }
        .clock {
            flex: none;
            margin-left: 8px;
            min-width: 84px;
            padding: 6px 10px;
            border-radius: 5px;
            text-align: center;
            font: 700 19px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
            font-variant-numeric: tabular-nums;
            background: #3d3b38;
            color: #9c9a97;
        }
        .clock[hidden] { display: none; }
        .clock.active { background: #fff; color: #262421; }
        .clock.low { color: #ff6b6b; }
        .clock.active.low { background: #cf4040; color: #fff; }
        .clock.flagged { background: #cf4040; color: #fff; }
        .who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .who .sub { color: var(--text-dim); font-size: 12px; }
        .captured { display: inline-flex; align-items: center; margin-left: auto; padding-left: 8px; }
        .captured img { width: 20px; height: 20px; margin-left: -6px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
        .captured img:first-child { margin-left: 0; }
        .mat-diff { color: var(--text-dim); font-size: 12px; margin-left: 6px; }
        .board-wrap {
            /* khong dung calc(100% - x): cha (board-side) co theo content -> % giai quyet vong cho gia tri rac lam ban co be xiu */
            width: min(76vmin, 640px);
            max-width: 100%;
            align-self: center;
            margin: 0 auto;
            aspect-ratio: 1;
            position: relative;
            user-select: none;
            touch-action: none;
        }
        #board {
            position: absolute; inset: 0;
            display: grid;
            grid-template: repeat(8, 1fr) / repeat(8, 1fr);
            box-shadow: 0 2px 12px rgba(0,0,0,.4);
        }
        .sq { position: relative; background: transparent; }
        .sq.light { background: var(--sq-light); }
        .sq.dark { background: var(--sq-dark); }
        .sq .coord {
            position: absolute;
            font-size: 9px;
            font-weight: 700;
            opacity: .8;
            pointer-events: none;
        }
        .sq .coord.rank { top: 2px; left: 2px; }
        .sq .coord.file { bottom: 1px; right: 2px; }
        .sq.hl { box-shadow: inset 0 0 0 40px var(--hl); }
        .sq.check::after {
            content: "";
            position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(255,77,77,.85) 20%, rgba(255,77,77,.28) 65%, transparent 75%);
        }
        .piece {
            position: absolute; inset: 6%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            z-index: 2;
        }
        .piece.dragging { z-index: 50; cursor: grabbing; }
        .sq .target {
            position: absolute; inset: 0;
            display: grid; place-items: center;
            pointer-events: none;
            z-index: 3;
        }
        .sq .target.dot { }
        .sq .target.dot::after {
            content: "";
            width: 30%; height: 30%;
            border-radius: 50%;
            background: rgba(22, 22, 22, .45);
        }
        .sq .target.ring::after {
            content: "";
            width: 88%; height: 88%;
            border-radius: 50%;
            border: 4px solid rgba(22, 22, 22, .45);
        }
        .sq.hint-from { box-shadow: inset 0 0 0 40px rgba(96, 165, 250, .45); }
        .sq.hint-to { box-shadow: inset 0 0 0 6px rgba(96, 165, 250, .8); }
        .panel {
            width: 292px;
            max-width: 34vw;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            background: var(--panel-dark);
            border-radius: 8px;
            overflow-x: hidden;
            overflow-y: auto;      /* man hinh nam ngang thap (dien thoai xoay ngang): panel cuon duoc thay vi bi cat */
        }
        .panel-title {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-weight: 700; font-size: 15px;
            padding: 10px;
            border-bottom: 1px solid var(--line);
        }
        .panel-status {
            padding: 9px 12px;
            font-size: 13px;
            color: var(--text-dim);
            border-bottom: 1px solid var(--line);
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
        }
        .badge {
            font-size: 11px; font-weight: 700;
            background: #4a4845; color: #d6d4d1;
            border-radius: 20px; padding: 2px 8px;
        }
        .moves {
            flex: 1;
            min-height: 120px;
            overflow-y: auto;
            touch-action: pan-y;
            font-variant-numeric: tabular-nums;
        }
        .mv-row { display: flex; align-items: stretch; }
        .mv-row:nth-child(odd) { background: #2c2b29; }
        .mv-num {
            width: 34px;
            padding: 6px 0 6px 10px;
            color: var(--text-dim);
            flex: none;
            align-self: center;
        }
        .mv {
            flex: 1;
            padding: 6px 0;
            text-align: center;
        }
        .mv.last { background: #474644; border-radius: 6px; margin: 0 4px; padding: 6px 0; }
        .mv-empty { flex: 1; }
        .actions { display: grid; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
        .bgm {
            display: grid;
            grid-template-columns: minmax(0, 1fr);      /* khong cho dong status nowrap ep track giãn qua rong */
            gap: 6px;
            padding: 8px 10px;
            border-top: 1px solid var(--line);
            font-size: 12px;
            color: var(--text-dim);
        }
        .bgm[hidden] { display: none; }
        .bgm-row { display: flex; align-items: center; gap: 5px; min-width: 0; }
        .elo-row {
            display: flex; align-items: center; gap: 5px; min-width: 0;
            padding: 8px 10px 0;
            font-size: 12px; color: var(--text-dim);
        }
        .elo-row[hidden] { display: none; }
        .elo-row span { flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .elo-row input[type="range"] { flex: 1; min-width: 0; height: 18px; accent-color: #779556; }
        #overlay {
            position: fixed; inset: 0; z-index: 60; background: transparent;
            display: flex; align-items: center; justify-content: center;
        }
        #overlay[hidden] { display: none; }
        #overlay-frame { width: 100%; height: 100%; border: none; display: block; }
        #overlay-skip {
            position: absolute; bottom: 46px; right: 64px; z-index: 61;
            font-size: 12px; padding: 6px 14px; display: none;
        }
        .bgm-row select, .bgm-row input[type="text"] {
            flex: 1;
            min-width: 0;
            height: 26px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background-color: #262421;
            color: var(--text);
            font: inherit;
            font-size: 11px;
        }
        .bgm-row select {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 22px;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%239c9a97' stroke-width='1.5' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            cursor: pointer;
        }
        .bgm-row input[type="range"] { flex: 1; min-width: 0; height: 18px; accent-color: #779556; }
        .bgm-mini { width: 28px; height: 26px; padding: 0; font-size: 11px; flex: none; border-radius: 5px; }
        .bgm-status { min-height: 12px; color: var(--text-dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn {
            height: 34px;
            border-radius: 6px;
            border: 0;
            background: #33312e;
            color: var(--text);
            font: inherit; font-size: 13px;
            display: grid; place-items: center;
            cursor: pointer;
        }
        .btn:hover { background: #3d3b38; }
        .btn[disabled] { opacity: .5; cursor: default; }
        #theme-toggle[hidden] { display: none; }
        #theme-toggle {
            position: fixed; top: 14px; right: 16px; z-index: 55;
            height: 30px; padding: 0 12px; font-size: 11px;
            border: 1px solid var(--line); background: rgba(38,36,33,.92);
        }
        .promote {
            position: absolute;
            z-index: 90;
            display: none;
            background: #33312e;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,.5);
            padding: 6px;
        }
        .promote img {
            width: 48px; height: 48px;
            display: block;
            cursor: pointer;
            border-radius: 6px;
        }
        .promote img:hover { background: #4a4845; }
        #toaster {
            position: absolute;
            left: 50%; bottom: 18%;
            transform: translateX(-50%);
            background: rgba(20, 21, 26, .95);
            color: #fff;
            border-radius: 8px;
            padding: 8px 14px;
            z-index: 100;
            display: none;
            max-width: 80%;
        }
        @media (max-width: 760px), (max-aspect-ratio: 4/5) {
            /* rule goc dat touch-action:none tren html/body -> chan keo cuon tren mobile; o day cho phep cuon doc */
            html, body { height: auto; min-height: 100%; touch-action: pan-y; }
            body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
            #root { height: auto; min-height: 100%; }
            .layout {
                height: auto;
                min-height: 100%;
                flex-direction: column;
                justify-content: flex-start;
                gap: 8px;
                padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
            }
            .board-side { width: 100%; }
            /* kich thuoc ro rang theo vw (khong dung % + aspect-ratio: WebView mobile co the cho ra 0 -> mat ban co) */
            .board-wrap { width: min(calc(100vw - 20px), 640px); height: min(calc(100vw - 20px), 640px); flex: none; }
            .player-bar { padding: 4px 2px; }
            .avatar { width: 30px; height: 30px; }
            .clock { min-width: 72px; padding: 5px 8px; font-size: 17px; }
            #bar-top { padding-right: 96px; }
            #theme-toggle { top: 8px; right: 8px; height: 26px; padding: 0 8px; font-size: 10px; }
            .panel {
                width: 100%;
                max-width: none;
                min-width: 0;
                height: auto;
                overflow: visible;
            }
            .panel-title { padding: 8px 10px; }
            .panel-status { padding: 7px 10px; }
            .actions {
                order: 2;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                padding: 10px;
                border-bottom: 1px solid var(--line);
            }
            .elo-row { order: 3; }
            .bgm { order: 4; }
            .moves {
                order: 5;
                flex: none;
                min-height: 0;
                max-height: none;
                overflow: visible;
                touch-action: auto;
            }
        }
    </style>
    <!-- tai truoc webp 3MB cua man loading song song voi trang (iframe loading.html dung lai tu cache) -->
    <link rel="preload" as="image" href="/loading/now-loading.webp">
    <script src="/arona-early.js?v=12"></script>
</head>
<body>
<div id="root">
    <div class="layout">
        <div class="board-side">
            <div class="player-bar" id="bar-top">
                <img class="avatar" id="top-avatar" alt="">
                <span class="avatar letter" id="top-avatar-lg" hidden></span>
                <div class="who">
                    <div class="name" id="top-name"></div>
                    <div class="sub" id="top-sub"></div>
                </div>
                <span class="captured" id="captured-top"></span>
                <span class="clock" id="top-clock" hidden></span>
            </div>
            <div class="board-wrap">
                <div id="board"></div>
                <div class="promote" id="promote"></div>
                <div id="toaster"></div>
            </div>
            <div class="player-bar" id="bar-bottom">
                <img class="avatar" id="bottom-avatar" alt="">
                <span class="avatar letter" id="bottom-avatar-lg" hidden></span>
                <div class="who">
                    <div class="name" id="bottom-name"></div>
                    <div class="sub" id="bottom-sub"></div>
                </div>
                <span class="captured" id="captured"></span>
                <span class="clock" id="bottom-clock" hidden></span>
            </div>
        </div>
        <aside class="panel" id="panel">
            <div class="panel-title" id="panel-title"></div>
            <div class="panel-status"><span id="status"></span><span class="badge" id="room"></span></div>
            <div class="moves" id="moves"></div>
            <div class="actions" id="actions"></div>
            <div class="elo-row" id="elo" hidden>
                <span id="elo-label">⚡ Arona ~1500 elo</span>
                <input id="elo-slider" type="range" min="400" max="3190" step="10" value="1500"
                       title="Độ mạnh của Arona — áp dụng từ lần New game tới">
            </div>
            <div class="bgm" id="bgm" hidden>
                <div class="bgm-row head">
                    <span title="Nhạc nền ván cờ">🎵 BGM</span>
                    <select id="bgm-select"></select>
                </div>
                <div class="bgm-row">
                    <input id="bgm-custom" type="text" placeholder="Paste a YouTube link..." spellcheck="false">
                    <button class="btn bgm-mini" id="bgm-custom-btn">▶</button>
                </div>
                <div class="bgm-row">
                    🔊 <input id="bgm-vol" type="range" min="0" max="100" value="35">
                    <button class="btn bgm-mini" id="bgm-stop" title="Stop">⏹</button>
                </div>
                <div class="bgm-status" id="bgm-status"></div>
            </div>
        </aside>
    </div>
</div>
<button id="theme-toggle" class="btn" hidden>Theme: Classic</button>
<div id="overlay" hidden>
    <iframe id="overlay-frame" src="about:blank"></iframe>
    <button id="overlay-skip" class="btn">Continue</button>
</div>
<div id="gate"><iframe src="/loading/loading.html?v=13" style="position:absolute;inset:0;width:100%;height:100%;display:block;border:none;background:#000;" allow="autoplay"></iframe></div>
<script type="module" src="/arona-boot.js?v=12"></script>
<script type="module" src="/arona-board.js?v=16"></script>
<script type="module" src="/arona-fx.js?v=12"></script>
</body>
</html>
